<!DOCTYPE html>
<html lang="en">
<head>

      text-align: center;

      max-height: 400px;
      overflow-y: auto;
      user-select: text;
      color: black;
    }
    a.back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background-color: rgba(255, 255, 255, 0.4);
      color: #fff;
      font-weight: bold;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: background-color 0.3s ease;
      user-select: none;
    }
    a.back-link:hover {
      background-color: rgba(255, 255, 255, 0.6);
    }
  </style>
  <!-- Include Karaoke.js or similar library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/karaoke.js@1.0.0/dist/karaoke.min.js"></script>
